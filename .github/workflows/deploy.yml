name: 🚀 React ToDo App | Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Deploy | Build and publish to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@v6

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: "npm"

      - name: 📦 NPM | Install dependencies
        run: npm ci

      - name: 🛠️ NPM | Build project
        run: npm run build

      - name: ⚙️ Pages | Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Pages | Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

      - name: 🚀 Pages | Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
