name: 🚀 React ToDo App | CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: 🔍 Verify | Lint, format, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@v7

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 NPM | Install dependencies
        run: npm ci

      - name: 🧹 Oxlint | Lint code
        run: npm run lint -- --format github

      - name: 🎨 Oxfmt | Check formatting
        run: npm run format:check

      - name: 🧠 TypeScript | Check types
        run: npm run typecheck

      - name: 🧪 Vitest | Run tests with coverage
        run: npm run test:coverage

      - name: 📊 Coverage | Publish summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Coverage | Upload report
        if: ${{ !cancelled() && hashFiles('coverage/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  build:
    name: 🛠️ Build | Bundle application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@v7

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 NPM | Install dependencies
        run: npm ci

      - name: 🛠️ Vite | Build project
        run: npm run build

      - name: ⚙️ Pages | Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: 📤 Pages | Upload build artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  dependency-review:
    name: 🛡️ Security | Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@v7

      - name: 🛡️ GitHub | Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  deploy:
    name: 🚀 Deploy | Publish to GitHub Pages
    needs: [verify, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: 🚀 Pages | Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
