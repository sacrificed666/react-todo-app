# Only production may be indexed
map "${APP_ENV}" $robots_tag {
    production "all";
    default "noindex, nofollow";
}

# Hashed assets never change, everything else is revalidated
map $uri $cache_control {
    ~^/tasks/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # The Content Security Policy ships in index.html
    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The app lives under the same base path as on GitHub Pages
    location = / {
        return 302 /tasks/;
    }

    location /tasks/ {
        try_files $uri $uri/ /tasks/index.html;
    }
}
