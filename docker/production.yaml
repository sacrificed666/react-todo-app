# Production build on nginx, served behind a reverse proxy that terminates TLS
name: tasks-production

services:
  app:
    image: tasks:production
    build:
      target: runtime
      args:
        APP_ENV: production
    environment:
      APP_ENV: production
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
