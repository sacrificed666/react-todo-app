name: 🏷️ Todo App | Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 🏷️ Release | Publish the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🌿 Git | Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: 📝 Release | Check the version and read the notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: 🚀 GitHub | Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
